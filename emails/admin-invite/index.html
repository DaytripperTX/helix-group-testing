<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f1f5f7; color: #07101f; font-family: Arial, Helvetica, sans-serif;">
    <div style="max-width: 580px; margin: 0 auto; padding: 32px 20px;">
      <div style="border: 1px solid #d8e3e8; border-radius: 12px; background: #ffffff; padding: 28px;">
        <p style="margin: 0 0 8px; color: #b73546; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">The Helix Group Testing</p>
        <h1 style="margin: 0 0 16px; font-size: 24px;">Admin invitation</h1>
        <p style="margin: 0 0 20px; line-height: 1.55;">An owner invited {{recipientEmail}} to become a Helix admin. This email-bound link expires in seven days and can be used once.</p>
        <p style="margin: 0 0 22px;">
          <a href="{{inviteLink}}" style="display: inline-block; border-radius: 8px; background: #b73546; color: #ffffff; padding: 12px 18px; font-weight: 700; text-decoration: none;">Accept admin invitation</a>
        </p>
        <p style="margin: 0; color: #5a6973; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere;">If the button does not work, open this link:<br>{{inviteLink}}</p>
      </div>
    </div>
  </body>
</html>
